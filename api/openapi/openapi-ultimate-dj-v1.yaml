components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        detail:
          type: string
    QuoteCalculationRequest:
      type: object
      properties:
        event_type_id:
          type: integer
        package_id:
          type: integer
        duration_hours:
          type: number
        distance_km:
          type: number
        parking_available:
          type: boolean
    QuoteCalculationResponse:
      type: object
      properties:
        subtotal:
          type: string
        travel_fee:
          type: string
        total_amount:
          type: string
        deposit_amount:
          type: string
