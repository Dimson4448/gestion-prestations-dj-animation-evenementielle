openapi: 3.0.3
info:
  title: API Ultimate DJ
  version: 1.0.0
  description: API REST pour la gestion des prestations DJ et animation événementielle.
paths:
  /api/v1/appointments/:
    get:
      operationId: v1_appointments_list
      description: Ressource consultable par son propriétaire, mais écrite via les
        parcours métier ou l'administration.
      parameters:
      - in: query
        name: mode
        schema:
          type: string
          enum:
          - in_person
          - online
        description: |-
          * `online` - En ligne
          * `in_person` - En présentiel
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un terme de recherche.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          title: Statut
          enum:
          - cancelled
          - done
          - planned
        description: |-
          * `planned` - Planifié
          * `done` - Réalisé
          * `cancelled` - Annulé
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPreparatoryAppointmentList'
          description: ''
    post:
      operationId: v1_appointments_create
      description: Ressource consultable par son propriétaire, mais écrite via les
        parcours métier ou l'administration.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreparatoryAppointment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PreparatoryAppointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PreparatoryAppointment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparatoryAppointment'
          description: ''
  /api/v1/appointments/{id}/:
    get:
      operationId: v1_appointments_retrieve
      description: Ressource consultable par son propriétaire, mais écrite via les
        parcours métier ou l'administration.
      parameters:
      - in: path
        name: id
