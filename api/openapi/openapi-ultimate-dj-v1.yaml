              $ref: '#/components/schemas/PatchedPreparatoryAppointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPreparatoryAppointment'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparatoryAppointment'
          description: ''
    delete:
