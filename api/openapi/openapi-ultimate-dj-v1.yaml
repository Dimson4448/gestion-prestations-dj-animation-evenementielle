components:
  schemas:
    AccountDeletionRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client_email:
          type: string
          format: email
          readOnly: true
        client_name:
          type: string
          readOnly: true
        reason:
          type: string
          title: Motif
        status:
          allOf:
          - $ref: '#/components/schemas/AccountDeletionRequestStatusEnum'
          readOnly: true
          title: Statut
        review_message:
          type: string
          readOnly: true
          title: Réponse administrative
        requested_at:
          type: string
          format: date-time
          readOnly: true
          title: Demandée le
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Traitée le
      required:
      - client_email
      - client_name
      - id
      - reason
      - requested_at
      - review_message
      - reviewed_at
      - status
    AccountDeletionRequestStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      - cancelled
      type: string
      description: |-
        * `pending` - En attente
        * `approved` - Approuvée
        * `rejected` - Refusée
        * `cancelled` - Annulée par le client
    AccountDeletionReview:
      type: object
      properties:
        decision:
          $ref: '#/components/schemas/DecisionEnum'
        review_message:
          type: string
          minLength: 10
      required:
      - decision
      - review_message
    Booking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        quote:
          type: integer
          title: Devis
        client:
          type: integer
        dj:
          type: integer
        event_type:
          type: integer
          title: Type d'événement
        package:
          type: integer
        venue:
          type: integer
          title: Lieu
        equipment:
          type: array
          items:
            type: integer
            title: Matériel
          readOnly: true
          title: Matériel
        event_date:
          type: string
          format: date
          title: Date de l'événement
        start_time:
          type: string
          format: time
          title: Heure de début
        end_time:
          type: string
          format: time
          title: Heure de fin
        status:
          allOf:
          - $ref: '#/components/schemas/BookingStatusEnum'
          title: Statut
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Montant total
        deposit_required:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Acompte requis
        deposit_paid:
          type: boolean
          title: Acompte payé
        cancellation_reason:
          type: string
          title: Motif d'annulation
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Créé le
        liens:
          type: object
          additionalProperties: {}
          readOnly: true
      required:
      - created_at
      - deposit_required
      - dj
      - end_time
      - equipment
      - event_date
      - event_type
      - id
      - liens
      - package
      - quote
      - start_time
      - total_amount
      - venue
    BookingCancellation:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
          minLength: 5
      required:
      - reason
    BookingStatusEnum:
      enum:
      - preparatory_meeting
      - confirmed
      - performed
      - paid
      - cancelled
      type: string
      description: |-
        * `preparatory_meeting` - Rendez-vous préparatoire
        * `confirmed` - Confirmé
        * `performed` - Presté
        * `paid` - Payé
        * `cancelled` - Annulé
    CancellationRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        booking:
          type: integer
          readOnly: true
          title: Réservation
        reason:
          type: string
          readOnly: true
          title: Motif
        status:
          allOf:
          - $ref: '#/components/schemas/CancellationRequestStatusEnum'
          readOnly: true
          title: Statut
        requested_at:
          type: string
          format: date-time
          readOnly: true
          title: Demandée le
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          title: Traitée le
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
          title: Traitée par
        review_message:
          type: string
          readOnly: true
          title: Réponse administrative
      required:
      - booking
      - id
      - reason
      - requested_at
      - review_message
      - reviewed_at
      - reviewed_by
      - status
    CancellationRequestReview:
      type: object
      properties:
        message:
          type: string
          maxLength: 255
          minLength: 5
      required:
      - message
    CancellationRequestStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - En attente
        * `approved` - Acceptée
        * `rejected` - Refusée
    ClientProfileUpdate:
      type: object
      properties:
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          readOnly: true
        date_of_birth:
          type: string
          format: date
        phone:
          type: string
          maxLength: 30
        billing_address:
          type: string
          maxLength: 255
        billing_city:
          type: string
          maxLength: 80
        billing_postal_code:
          type: string
          maxLength: 20
        preferred_language:
          $ref: '#/components/schemas/PreferredLanguageEnum'
      required:
      - billing_address
      - billing_city
      - billing_postal_code
      - date_of_birth
      - email
      - first_name
      - last_name
      - phone
      - preferred_language
    ClientRegistration:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        password:
          type: string
