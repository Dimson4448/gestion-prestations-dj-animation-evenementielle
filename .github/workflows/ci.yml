name: Validation Ultimate DJ

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ultimate-dj-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Tests Django
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DB_ENGINE: sqlite
      SECRET_KEY: ci-Q7zT9pW4nK8xR2mV6bC3fH5jL1sD0gA9uE4yI8oP2qN6wZ3cF7hJ5
      DEBUG: "False"
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - name: Installer les dépendances
        run: python -m pip install --upgrade pip && pip install -r requirements-lock.txt
      - name: Vérifier Django et les migrations
        run: python manage.py check && python manage.py makemigrations --check --dry-run
      - name: Auditer la configuration de production
        env:
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
        run: python manage.py check --deploy --fail-level WARNING
      - name: Exécuter les tests
        run: python manage.py test

  frontend:
    name: Build React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: Tester le frontend
        run: npm test
      - name: Construire le frontend
        run: npm run build
